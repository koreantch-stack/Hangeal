name: APK 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 웹 파일을 앱 안으로 복사
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hangeul-viewer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hangeul-viewer.apk --title "한글뷰어 APK" --notes "폰에서 hangeul-viewer.apk를 받아 설치하세요." --target "$GITHUB_SHA"
