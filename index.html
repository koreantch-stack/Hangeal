<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2d5a46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>한글뷰어</title>
<style>
:root{--bg:#ffffff;--paper:#ffffff;--ink:#111111;--sub:#666666;--line:#d4d4d4;--bar:#ffffff;--accent:#2d5a46;--fs:17px}
[data-theme=dark]{--bg:#121212;--paper:#1c1c1c;--ink:#e8e8e8;--sub:#9a9a9a;--line:#3a3a3a;--bar:#1c1c1c;--accent:#8bc4a4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
#bar .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn,#bar button{font:inherit;font-size:14px;min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme=dark] .btn.main{color:#10150f}
#note{margin:10px 12px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--sub);line-height:1.5}
#note.err{color:#b3261e;border-color:#b3261e}
#doc{margin:10px 8px 40px;padding:18px 14px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:var(--fs);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;min-height:50vh}
.p{white-space:pre-wrap;margin:0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;min-width:100%}
td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
#doc td .p{line-height:1.55}
.ii{vertical-align:middle;max-width:100%}
.eq math{font-size:1.15em}
.pic{margin:8px 0;text-align:center}
.pic img{max-width:100%;height:auto}
.ph{color:var(--sub);font-size:.85em}
.box{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.empty{color:var(--sub);text-align:center;padding:40px 10px;line-height:1.8}
.empty b{color:var(--ink)}

.pb{height:0;border-top:1px dashed var(--line);margin:10px 0}
#pager{display:none;padding:8px 0 76px;touch-action:pan-y}
#pager.on{display:block}
#vp{overflow:auto;-webkit-overflow-scrolling:touch}
#wrap{margin:0 auto;position:relative}
.sheet{position:absolute;left:0;top:0;background:var(--paper);box-shadow:0 0 0 1px var(--line),0 2px 10px rgba(0,0,0,.12);transform-origin:0 0;overflow:hidden}
.pg{font-size:var(--pgfs,13.333px);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:none;text-size-adjust:none}
.sheet,#meas{-webkit-text-size-adjust:none;text-size-adjust:none}
.pg td{padding:2px 5px}
.pg .p{margin:0}
.sheet .pg{position:absolute;overflow:hidden}
#meas{position:absolute;left:-99999px;top:0;visibility:hidden}
#nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line);align-items:center;justify-content:center;gap:10px}
#nav.on{display:flex}
#nav button{flex:0 0 auto;min-width:64px}
#nav .pn{min-width:84px;text-align:center;font-weight:700;font-size:15px}
</style>
</head>
<body>
<header id="bar">
<span class="t" id="title">한글뷰어</span>
<label class="btn main" style="position:relative;overflow:hidden">열기<input id="f" type="file" style="position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer"></label>
<button id="sm" aria-label="글자 작게">가−</button>
<button id="lg" aria-label="글자 크게">가+</button>
<button id="md" aria-label="보기 방식">이어</button>
<button id="th" aria-label="화면 밝기">밤</button>
</header>
<div id="note" style="display:none"></div>
<div id="pager"><div id="vp"><div id="wrap"><div class="sheet" id="sheet"><div class="pg" id="pgb"></div></div></div></div></div>
<div id="nav"><button id="pv">이전</button><span class="pn" id="pn"></span><button id="nx">다음</button></div>
<div id="meas" class="pg"></div>
<main id="doc"><div class="empty"><b>열기</b>를 눌러 hwpx 또는 hwp 파일을 골라 주세요.<br>파일은 이 기기 안에서만 읽고, 밖으로 보내지 않아요.</div></main>
